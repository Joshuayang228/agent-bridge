<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>扫码配对 — Agent Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #1a1a2e; color: #eee;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 420px; width: 100%; text-align: center;
      background: #16213e; border: 1px solid #0f3460; border-radius: 16px;
      padding: 28px 24px;
    }
    .logo { font-size: 36px; margin-bottom: 8px; }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #7f8c8d; margin-bottom: 22px; line-height: 1.5; }
    .qr-wrap {
      background: #fff; padding: 16px; border-radius: 12px;
      display: inline-block; margin-bottom: 18px;
    }
    #qrcode { display: block; }
    .pair-code {
      font-size: 32px; font-weight: 700; letter-spacing: 10px;
      color: #e94560; padding: 10px 16px;
      background: #1a1a2e; border: 1px dashed #e94560;
      border-radius: 8px; display: inline-block; margin-bottom: 14px;
      font-family: monospace;
    }
    .pair-url {
      font-size: 12px; color: #5dade2; word-break: break-all;
      padding: 8px 12px; background: #1a1a2e; border-radius: 6px;
      font-family: monospace; margin-bottom: 18px;
    }
    .tips { font-size: 12px; color: #7f8c8d; line-height: 1.6; }
    .ips {
      margin-top: 16px; font-size: 11px; color: #7f8c8d;
      border-top: 1px solid #1a1a4e; padding-top: 12px;
    }
    .ips code { color: #5dade2; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌉</div>
    <h1>Agent Bridge 扫码配对</h1>
    <p class="subtitle">用手机摄像头扫下方二维码<br>或手动输入配对码</p>

    <div class="qr-wrap">
      <canvas id="qrcode"></canvas>
    </div>

    <div class="pair-code" id="pair-code">------</div>

    <div class="pair-url" id="pair-url">加载中...</div>

    <div class="tips">
      扫码后将自动打开手机端 Web App 并完成配对<br>
      配对成功后此页面可关闭
    </div>

    <div class="ips" id="ips"></div>
  </div>

  <script type="module">
    // 服务端注入 window.__PAIR__
    const PAIR = window.__PAIR__ || { code: "------", url: "", ips: [] };

    document.getElementById("pair-code").textContent = PAIR.code;
    document.getElementById("pair-url").textContent = PAIR.url || "(未获取到 URL)";

    // 局域网 IP 列表
    const ipsEl = document.getElementById("ips");
    if (PAIR.ips && PAIR.ips.length > 0) {
      ipsEl.innerHTML = "局域网地址：" + PAIR.ips.map((ip) => `<code>http://${ip}:18789/pair</code>`).join(" / ");
    } else {
      ipsEl.textContent = "未检测到局域网 IP，可使用 localhost 在本机访问";
    }

    // 用 esm.sh 加载 qrcode（CORS 友好，不受 ORB 拦截）
    const canvas = document.getElementById("qrcode");
    if (PAIR.url) {
      try {
        const QRCode = (await import("https://esm.sh/qrcode@1.5.3")).default;
        QRCode.toCanvas(canvas, PAIR.url, { width: 240, margin: 1 }, (err) => {
          if (err) console.error("二维码渲染失败:", err);
        });
      } catch (e) {
        canvas.replaceWith(Object.assign(document.createElement("div"), {
          textContent: "二维码库加载失败，请检查网络",
          style: "color:#e74c3c;padding:20px;",
        }));
        console.error("qrcode 加载失败:", e);
      }
    }
  </script>
</body>
</html>
